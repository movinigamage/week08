name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ---------------------------------------------------------
  # Terraform - Infrastructure as Code
  # ---------------------------------------------------------
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan


  # ---------------------------------------------------------
  # Backend Tests
  # ---------------------------------------------------------
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: terraform

    strategy:
      matrix:
        include:
          - service: user-service
            database: users

          - service: student-service
            database: students

          - service: lecturer-service
            database: lecturers

          - service: course-service
            database: courses

          - service: enrollment-service
            database: enrollments

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}
        run: |
          pytest


  # ---------------------------------------------------------
  # Build and Push Docker Images
  # ---------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and Push Frontend
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ github.sha }} \
            ./frontend

          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ github.sha }}

      - name: Build and Push User Service
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ github.sha }} \
            ./user-service

          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ github.sha }}

      - name: Build and Push Student Service
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ github.sha }} \
            ./student-service

          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ github.sha }}

      - name: Build and Push Lecturer Service
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ github.sha }} \
            ./lecturer-service

          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ github.sha }}

      - name: Build and Push Course Service
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ github.sha }} \
            ./course-service

          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ github.sha }}

      - name: Build and Push Enrollment Service
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ github.sha }} \
            ./enrollment-service

          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ github.sha }}