apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-green
  namespace: production

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service
      slot: green

  template:
    metadata:
      labels:
        app: user-service
        slot: green

    spec:
      containers:
        - name: user-service
          image: movinisit722w10acr2026.azurecr.io/koalatech-user-service:7e1ecfd1bb115079cd54f6de018fc8950faa8c0c
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: users

            - name: POSTGRES_HOST
              value: user-db

            - name: POSTGRES_PORT
              value: "5432"

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: JWT_SECRET_KEY

            - name: JWT_ALGORITHM
              value: HS256

            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"

            - name: DEFAULT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: DEFAULT_ADMIN_USERNAME

            - name: DEFAULT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: DEFAULT_ADMIN_EMAIL

            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: DEFAULT_ADMIN_PASSWORD